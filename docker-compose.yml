name: peakatail-hub

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: peakatail-hub-backend:latest
    environment:
      HUB_DB_PATH: /data/hub.duckdb
      HUB_CACHE_DIR: /cache
      # ── Real ema geneview (2026-08-14) ──────────────────────────────────────
      # `ema switch geneview` runs on the HOST (the analysis venv, not this
      # container -- see geneview-worker/README.md for what to start and how).
      # HUB_RUNS_ROOT_HOST MUST equal PEAKATAIL_RUNS below (same host path,
      # this container's own view of it) so generated figures -- written by the
      # host-side worker directly onto the host filesystem -- can be read back
      # through /runs. host.docker.internal needs `extra_hosts` (below) on
      # Linux Docker Engine (20.10+); it's automatic on Docker Desktop.
      HUB_GENEVIEW_WORKER_URL: ${HUB_GENEVIEW_WORKER_URL:-http://host.docker.internal:8095}
      HUB_RUNS_ROOT_HOST: ${PEAKATAIL_RUNS:-./packages/contract/fixtures}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hub-db:/data
      - hub-cache:/cache
      # ── READ ACCESS to your PeakATail run data ─────────────────────────────
      # PEAKATAIL_RUNS = a HOST directory containing run_manifest.json file(s)
      # at any depth. Mounted READ-ONLY (:ro) — the hub never writes into your
      # run dirs (the geneview worker, running on the HOST outside this
      # container, is what actually writes generated figures under each run's
      # B3_switch/geneview_cache/ -- this mount only ever needs to read them
      # back). Defaults to the bundled fixture run so it works out of the box.
      # Index it into DuckDB with `make docker-index` (or `make up`, which does it).
      #   e.g.  PEAKATAIL_RUNS=/mnt/ssd2/.../runs_root make up
      - ${PEAKATAIL_RUNS:-./packages/contract/fixtures}:/runs:ro
    ports:
      - "${HUB_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: peakatail-hub-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HUB_WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  hub-db:
  hub-cache:

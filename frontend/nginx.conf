server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy: /api/* -> the backend service, stripping the /api prefix.
    # (Mirrors the vite dev-server rewrite so the built client's default
    #  VITE_API_BASE='/api' reaches hub serve's root-mounted routes.)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Geneview renderer proxy: /geneview/* -> the host-side ema geneview
    # microservice (port 8093). First (uncached) render runs ema (~15s), so the
    # read timeout is generous. Reaches the host via its LAN IP (the service
    # binds 0.0.0.0:8093).
    location /geneview/ {
        proxy_pass http://155.223.31.208:8093/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
